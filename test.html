<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        
        .content {
            margin: 30px 0;
        }
        
        .contact-link {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }
        
        .contact-link:hover {
            background-color: #0056b3;
        }
        
        .page-content {
            font-size: 18px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="content">
        <div id="home-page" class="page-content">
            <h1>Welcome!</h1>
            <p>This is Home Page!</p>
            <a href="?q=contact us" class="contact-link">Contact Us</a>
        </div>
        
        <div id="contact-page" class="page-content" style="display: none;">
            <h1>Thank you!</h1>
            <p>This is a Contact Us page</p>
            <a href="?" class="contact-link">Back to Home</a>
        </div>
    </div>

    <script>
        // Check URL parameters and show appropriate content
        function checkPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q');
            
            const homePage = document.getElementById('home-page');
            const contactPage = document.getElementById('contact-page');
            
            if (query === 'contact us') {
                homePage.style.display = 'none';
                contactPage.style.display = 'block';
            } else {
                homePage.style.display = 'block';
                contactPage.style.display = 'none';
            }
        }
        
        // Check page on load
        checkPage();
        
        // Listen for back/forward button clicks
        window.addEventListener('popstate', checkPage);
    </script>
</body>
</html>
